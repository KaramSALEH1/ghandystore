# Add inside your `server {}` block for ghandy.cloud.

# Serve static files with long-lived caching.
location /static/ {
    alias /path/to/project/staticfiles/;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Cache media files for a shorter period (content can change).
location /media/ {
    alias /path/to/project/media/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

# Gzip for text assets.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

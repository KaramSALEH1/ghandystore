{% extends 'base/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="panel mx-auto my-6 w-full max-w-lg p-4 sm:p-6">
<h1 class="mb-4 sm:mb-6">{{ title }}</h1>

<form method="post" action="." enctype="multipart/form-data">
    {% csrf_token %}

    <div class="space-y-4">
        {{ form.as_p }}
    </div>

    {% if form.errors or form.non_field_errors %}
        <div class="mb-3 rounded-xl2 border border-danger-500/30 bg-danger-50 p-6 text-danger-700">
            {% for field in form %}
                {{ field.errors }}
            {% endfor %}

            {{ form.non_field_errors }}
        </div>
    {% endif %}

    <button class="btn btn-primary mt-4 w-full sm:mt-6" type="submit">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="m13 6 6 6-6 6" />
        </svg>
        <span>Submit</span>
    </button>
</form>
</div>
{% endblock %}

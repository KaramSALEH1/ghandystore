<div class="relative card-soft overflow-hidden transition-all duration-200 hover:shadow-md hover:scale-[1.02]">
    {% if product.is_sold or product.is_out_of_stock %}
    <div class="absolute right-4 top-4 z-10 rounded-full bg-red-100 px-3 py-1 text-xs font-semibold text-red-700">Out of
        store</div>
    {% endif %}
    <a href="{% url 'item:detail' product.id %}">
        <div class="media-frame aspect-[1/1.04] rounded-b-none bg-secondary-100/70">
            {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}">
            {% else %}
            <div class="flex h-full w-full items-center justify-center bg-neutral-200/60 text-sm text-neutral-500">No
                image</div>
            {% endif %}
        </div>
    </a>
    <div class="p-4">
        <a href="{% url 'item:detail' product.id %}" class="block">
            <h3 class="text-lg sm:text-xl">{{ product.name }}</h3>
            <p class="mt-1 text-sm text-neutral-600">SYP {{ product.price|floatformat:2 }}</p>
        </a>
        <form method="post" action="{% url 'item:add_to_cart' product.id %}" class="mt-3">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.get_full_path }}">
            <button type="submit"
                class="btn btn-secondary btn-sm w-full justify-center {% if product.is_sold or product.is_out_of_stock %}opacity-50 cursor-not-allowed{% endif %}"
                {% if product.is_sold or product.is_out_of_stock %}disabled{% endif %}>
                {% if product.is_sold or product.is_out_of_stock %}Sold out{% else %}Add to cart{% endif %}
            </button>
        </form>
    </div>
</div>

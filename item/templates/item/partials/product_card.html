{% load item_extras %}
<div class="relative card-soft overflow-hidden transition-all duration-200 hover:scale-[1.02] hover:shadow-md"
    style="border-color: {{ product|item_accent_border }};">
    {% if product.is_sold or product.is_out_of_stock %}
    <div class="absolute right-4 top-4 z-10 rounded-full bg-red-100 px-3 py-1 text-xs font-semibold text-red-700 font-arabic" dir="rtl">غير متوفر</div>
    {% endif %}
    <a href="{% url 'item:detail' product.id %}">
        <div class="media-frame aspect-[1/1.04] rounded-b-none"
            style="background-color: {{ product|item_accent_surface }};">
            {% if product.image_url %}
            <img src="{{ product.image_url }}" alt="{{ product.name }}">
            {% else %}
            <div class="flex h-full w-full items-center justify-center bg-neutral-200/60 text-sm text-neutral-500 font-arabic" dir="rtl">لا توجد صورة</div>
            {% endif %}
        </div>
    </a>
    <div class="p-4">
        <a href="{% url 'item:detail' product.id %}" class="block">
            <h3 class="text-lg sm:text-xl">{{ product.name }}</h3>
            <p class="mt-1 text-sm text-neutral-600 font-arabic" dir="rtl">{{ product.price|floatformat:2 }} ل.س</p>
        </a>
        <a href="{% url 'item:detail' product.id %}"
            class="btn btn-secondary btn-sm w-full justify-center font-arabic mt-3" dir="rtl">
            اختر اللون
        </a>
    </div>
</div>
